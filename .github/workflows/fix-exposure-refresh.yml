name: Fix exposure management refresh

on:
  push:
    branches:
      - agent/derivatives-tab
    paths:
      - .github/workflows/fix-exposure-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/derivatives-tab
          fetch-depth: 0

      - name: Apply refresh fix
        run: python3 .github/scripts/fix_exposure_refresh.py

      - name: Commit fix and remove temporary files
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-exposure-refresh.yml
          git rm .github/scripts/fix_exposure_refresh.py
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/ExposureManagementView.java
          git diff --cached --check
          git commit -m "Fix Exposuremanagement type refresh"
          git push origin HEAD:agent/derivatives-tab
