name: Apply security multiplier persistence patch

on:
  push:
    branches:
      - agent/security-multiplier

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[multiplier-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-multiplier

      - name: Apply persistence patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          writer_path = Path('name.abuchen.portfolio/src/name/abuchen/portfolio/model/ProtobufWriter.java')
          text = writer_path.read_text(encoding='utf-8')

          old_import = 'import name.abuchen.portfolio.model.proto.v1.PSecurityEvent;\n'
          new_import = old_import + 'import name.abuchen.portfolio.model.proto.v1.PSecurityMultiplier;\n'
          if 'PSecurityMultiplier;' not in text:
              if old_import not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(old_import, new_import, 1)

          load_anchor = '''            security.protobufSetPrices(newSecurity.getPricesList().stream()\n                            .map(p -> new SecurityPrice(LocalDate.ofEpochDay(p.getDate()), p.getClose()))\n                            .collect(toMutableList()));\n'''
          load_block = load_anchor + '''\n            security.protobufSetMultipliers(newSecurity.getMultipliersList().stream()\n                            .map(m -> new SecurityMultiplier(LocalDate.ofEpochDay(m.getDate()), m.getValue()))\n                            .collect(toMutableList()));\n'''
          if 'newSecurity.getMultipliersList()' not in text:
              if load_anchor not in text:
                  raise SystemExit('Load anchor not found')
              text = text.replace(load_anchor, load_block, 1)

          save_anchor = '''            for (SecurityPrice price : security.getPrices())\n            {\n                newSecurity.addPrices(PHistoricalPrice.newBuilder().setDate(price.getDate().toEpochDay())\n                                .setClose(price.getValue()).build());\n            }\n'''
          save_block = save_anchor + '''\n            for (SecurityMultiplier multiplier : security.getMultipliers())\n            {\n                newSecurity.addMultipliers(PSecurityMultiplier.newBuilder()\n                                .setDate(multiplier.getDate().toEpochDay())\n                                .setValue(multiplier.getValue()).build());\n            }\n'''
          if 'newSecurity.addMultipliers(' not in text:
              if save_anchor not in text:
                  raise SystemExit('Save anchor not found')
              text = text.replace(save_anchor, save_block, 1)

          writer_path.write_text(text, encoding='utf-8')

          test_path = Path('name.abuchen.portfolio.tests/src/name/abuchen/portfolio/model/SecurityMultiplierPersistenceTest.java')
          test_path.write_text('''package name.abuchen.portfolio.model;\n\nimport static org.hamcrest.CoreMatchers.is;\nimport static org.hamcrest.MatcherAssert.assertThat;\n\nimport java.io.ByteArrayInputStream;\nimport java.io.ByteArrayOutputStream;\nimport java.io.File;\nimport java.io.FileInputStream;\nimport java.io.IOException;\nimport java.time.LocalDate;\n\nimport org.junit.Rule;\nimport org.junit.Test;\nimport org.junit.rules.TemporaryFolder;\n\n@SuppressWarnings("nls")\npublic class SecurityMultiplierPersistenceTest\n{\n    @Rule\n    public TemporaryFolder tempFolder = new TemporaryFolder();\n\n    @Test\n    public void testXmlRoundTrip() throws IOException\n    {\n        Client client = createClient();\n        client.getSaveFlags().clear();\n        client.getSaveFlags().add(SaveFlag.XML);\n\n        File file = tempFolder.newFile("multipliers.xml");\n        ClientFactory.save(client, file);\n\n        Client loaded;\n        try (FileInputStream input = new FileInputStream(file))\n        {\n            loaded = ClientFactory.load(input);\n        }\n\n        assertMultipliers(loaded);\n    }\n\n    @Test\n    public void testProtobufRoundTrip() throws IOException\n    {\n        Client client = createClient();\n        ProtobufWriter writer = new ProtobufWriter();\n\n        ByteArrayOutputStream output = new ByteArrayOutputStream();\n        writer.save(client, output);\n\n        Client loaded = writer.load(new ByteArrayInputStream(output.toByteArray()));\n\n        assertMultipliers(loaded);\n    }\n\n    private Client createClient()\n    {\n        Client client = new Client();\n        Security security = new Security("Test Future", "EUR");\n        security.addMultiplier(SecurityMultiplier.of(LocalDate.parse("2026-01-01"), 1000.0));\n        security.addMultiplier(SecurityMultiplier.of(LocalDate.parse("2026-07-01"), 1125.25));\n        client.addSecurity(security);\n        return client;\n    }\n\n    private void assertMultipliers(Client client)\n    {\n        assertThat(client.getSecurities().size(), is(1));\n\n        Security security = client.getSecurities().get(0);\n        assertThat(security.getMultipliers().size(), is(2));\n        assertThat(security.getMultiplier(LocalDate.parse("2025-12-31")), is(1.0));\n        assertThat(security.getMultiplier(LocalDate.parse("2026-05-01")), is(1000.0));\n        assertThat(security.getMultiplier(LocalDate.parse("2026-08-01")), is(1125.25));\n    }\n}\n''', encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add name.abuchen.portfolio/src/name/abuchen/portfolio/model/ProtobufWriter.java \
                  name.abuchen.portfolio.tests/src/name/abuchen/portfolio/model/SecurityMultiplierPersistenceTest.java
          git commit -m "[multiplier-patch] Persist security multipliers and add roundtrip tests"
          git push origin HEAD:agent/security-multiplier
