name: Apply K.O. master-data subtab

on:
  push:
    branches:
      - agent/ko-onvista-integration
    paths:
      - '.github/workflows/apply-ko-master-data-tab.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move K.O. master data into its own subtab
        shell: python
        run: |
          from pathlib import Path

          path = Path('name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/wizards/security/SecurityMultiplierPage.java')
          lines = path.read_text(encoding='utf-8').splitlines()

          option_anchor = 'optionGroup = new Group(optionTab, SWT.NONE);'
          option_matches = [i for i, line in enumerate(lines) if line.strip() == option_anchor]
          if len(option_matches) != 1:
              raise SystemExit(f'Expected one option group anchor, found {len(option_matches)}')
          option_index = option_matches[0]
          indent = lines[option_index][:-len(lines[option_index].lstrip())]

          tab_lines = [
              indent + 'Composite knockoutTab = new Composite(derivativeDetailsTabs, SWT.NONE);',
              indent + 'GridLayoutFactory.fillDefaults().numColumns(1).margins(8, 8).applyTo(knockoutTab);',
              indent + 'TabItem knockoutTabItem = new TabItem(derivativeDetailsTabs, SWT.NONE);',
              indent + 'knockoutTabItem.setText("K.O.-Stammdaten");',
              indent + 'knockoutTabItem.setControl(knockoutTab);',
              ''
          ]
          lines[option_index:option_index] = tab_lines

          ko_start_anchor = 'createAlignedLabel(optionGroup, "Issuer");'
          ko_end_anchor = 'initialKnockoutLevelLabel = createAlignedLabel(knockoutDetailsGroup, "Initial K.O. level");'
          start_matches = [i for i, line in enumerate(lines) if line.strip() == ko_start_anchor]
          if len(start_matches) != 1:
              raise SystemExit(f'Expected one K.O. block start, found {len(start_matches)}')
          ko_start = start_matches[0]
          end_matches = [i for i in range(ko_start, len(lines)) if lines[i].strip() == ko_end_anchor]
          if len(end_matches) != 1:
              raise SystemExit(f'Expected one K.O. block end, found {len(end_matches)}')
          ko_end = end_matches[0]
          k = lines[ko_start][:-len(lines[ko_start].lstrip())]

          ko_lines = [
              k + 'knockoutDetailsGroup = new Group(knockoutTab, SWT.NONE);',
              k + 'knockoutDetailsGroup.setText("K.O. certificate details");',
              k + 'GridLayoutFactory.fillDefaults().numColumns(4).margins(8, 8).spacing(8, 6).applyTo(knockoutDetailsGroup);',
              k + 'GridDataFactory.fillDefaults().grab(true, false).applyTo(knockoutDetailsGroup);',
              '',
              k + 'createAlignedLabel(knockoutDetailsGroup, "Issuer");',
              k + 'issuer = new Text(knockoutDetailsGroup, SWT.BORDER);',
              k + 'GridDataFactory.fillDefaults().hint(KO_DETAIL_FIELD_WIDTH, SWT.DEFAULT).applyTo(issuer);',
              k + 'new Label(knockoutDetailsGroup, SWT.NONE);',
              k + 'new Label(knockoutDetailsGroup, SWT.NONE);',
              '',
              k + 'createAlignedLabel(knockoutDetailsGroup, "Issuer product ID");',
              k + 'issuerProductId = new Text(knockoutDetailsGroup, SWT.BORDER);',
              k + 'GridDataFactory.fillDefaults().hint(KO_DETAIL_FIELD_WIDTH, SWT.DEFAULT).applyTo(issuerProductId);',
              k + 'new Label(knockoutDetailsGroup, SWT.NONE);',
              k + 'new Label(knockoutDetailsGroup, SWT.NONE);',
              '',
              k + 'createAlignedLabel(knockoutDetailsGroup, "Subscription ratio");',
              k + 'subscriptionRatio = new Text(knockoutDetailsGroup, SWT.BORDER | SWT.RIGHT);',
              k + 'subscriptionRatio.setToolTipText("Underlying units represented by one option/certificate.");',
              k + 'GridDataFactory.fillDefaults().hint(KO_DETAIL_FIELD_WIDTH, SWT.DEFAULT).applyTo(subscriptionRatio);',
              k + 'new Label(knockoutDetailsGroup, SWT.NONE);',
              k + 'new Label(knockoutDetailsGroup, SWT.NONE);',
              '',
              k + 'initialKnockoutLevelLabel = createAlignedLabel(knockoutDetailsGroup, "Initial K.O. level");'
          ]
          lines[ko_start:ko_end + 1] = ko_lines
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Commit source change and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/apply-ko-master-data-tab.yml'
          git add 'name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/wizards/security/SecurityMultiplierPage.java'
          git diff --cached --check
          git commit -m 'Move K.O. master data into dedicated subtab'
          git push origin "HEAD:${GITHUB_REF_NAME}"
