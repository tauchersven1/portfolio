name: Apply derivative layout refinements

on:
  push:
    branches:
      - agent/derivatives-tab
    paths:
      - .github/workflows/apply-derivative-layout-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/derivatives-tab
          fetch-depth: 0

      - name: Apply requested refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/wizards/security/SecurityMultiplierPage.java')
          text = page.read_text()

          old = 'GridLayoutFactory.fillDefaults().numColumns(3).margins(10, 10).spacing(10, 8).applyTo(riskParameters);'
          new = 'GridLayoutFactory.fillDefaults().numColumns(3).equalWidth(true).margins(10, 10).spacing(10, 8).applyTo(riskParameters);'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        firstTradingDay = new OptionalDateField(commonFields, "First trading day");
        expirationDate = new OptionalDateField(commonFields, "Expiration Date");

        addEmptyHalf(commonFields);
        lastTradingDay = new OptionalDateField(commonFields, "Last trading day");

        addEmptyHalf(commonFields);
        settlementDate = new OptionalDateField(commonFields, "Settlement date");'''
          new = '''        firstTradingDay = new OptionalDateField(commonFields, "First Trading Day");
        lastTradingDay = new OptionalDateField(commonFields, "Last Trading Day");

        addEmptyHalf(commonFields);
        expirationDate = new OptionalDateField(commonFields, "Expiration Date");

        addEmptyHalf(commonFields);
        settlementDate = new OptionalDateField(commonFields, "Settlement Date");'''
          assert old in text
          text = text.replace(old, new, 1)

          # In all three history editors, use four controls on the first row and
          # place Add / replace on a second full-width row so it cannot be clipped.
          old_layout = 'GridLayoutFactory.fillDefaults().numColumns(5).spacing(8, 0).applyTo(editor);'
          assert text.count(old_layout) == 3, text.count(old_layout)
          text = text.replace(old_layout, 'GridLayoutFactory.fillDefaults().numColumns(4).spacing(8, 4).applyTo(editor);')

          marker = '''        Button addOrReplace = new Button(editor, SWT.PUSH);
        addOrReplace.setText("Add / replace");'''
          replacement = '''        Button addOrReplace = new Button(editor, SWT.PUSH);
        addOrReplace.setText("Add / replace");
        GridDataFactory.fillDefaults().span(4, 1).applyTo(addOrReplace);'''
          assert text.count(marker) == 3, text.count(marker)
          text = text.replace(marker, replacement)

          page.write_text(text)

          view = Path('name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/StatementOfAssetsView.java')
          text = view.read_text()

          text = text.replace('import java.util.StringJoiner;\n', '')

          old = '''        assetViewer.getColumnHelper().addColumn(createContractDataColumn());
        assetViewer.getColumnHelper().addColumn(createPutCallColumn());'''
          new = '''        addDerivativeContractColumns();
        assetViewer.getColumnHelper().addColumn(createPutCallColumn());'''
          assert old in text
          text = text.replace(old, new, 1)

          start = text.index('    private Column createContractDataColumn()')
          end = text.index('    private Column createPutCallColumn()', start)
          replacement = '''    private void addDerivativeContractColumns()
    {
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeUnderlying", "Underlying",
                        "underlying", 140)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeContractSymbol",
                        "Contract / Trading Symbol", "contractSymbol", 150)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeExchange", "Exchange",
                        "exchange", 90)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeContractMonth",
                        "Contract Month", "contractMonth", 100)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeFirstTradingDay",
                        "First Trading Day", "firstTradingDay", 110)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeLastTradingDay",
                        "Last Trading Day", "lastTradingDay", 110)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeExpirationDate",
                        "Expiration Date", "expirationDate", 110)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeSettlementDate",
                        "Settlement Date", "settlementDate", 110)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeFirstNoticeDay",
                        "First Notice Day", "firstNoticeDay", 110)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeSettlementType",
                        "Settlement", "settlementType", 90)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeContractSize",
                        "Contract Size", "contractSize", 100)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
        assetViewer.getColumnHelper().addColumn(createDerivativePropertyColumn("derivativeTickSize", "Tick Size",
                        "tickSize", 90)); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$
    }

    private Column createDerivativePropertyColumn(String id, String label, String propertyName, int width)
    {
        Column column = new Column(id, label, SWT.LEFT, width);
        column.setGroupLabel(DERIVATIVES_GROUP);
        column.setLabelProvider(new ColumnLabelProvider()
        {
            @Override
            public String getText(Object e)
            {
                Element element = (Element) e;
                if (!element.isSecurity())
                    return null;

                Security security = element.getSecurity();
                if (property(security, "type") == null) //$NON-NLS-1$
                    return null;

                String value = property(security, propertyName);
                if ("settlementType".equals(propertyName)) //$NON-NLS-1$
                {
                    if ("CASH".equals(value)) //$NON-NLS-1$
                        return "Cash"; //$NON-NLS-1$
                    if ("PHYSICAL".equals(value)) //$NON-NLS-1$
                        return "Physical"; //$NON-NLS-1$
                }
                return value;
            }
        });
        column.setVisible(false);
        return column;
    }

'''
          text = text[:start] + replacement + text[end:]

          old = '''    private static void add(StringJoiner data, String label, String value)
    {
        if (value != null && !value.isBlank())
            data.add(label + ": " + value); //$NON-NLS-1$
    }

'''
          assert old in text
          text = text.replace(old, '', 1)

          view.write_text(text)
          PY

      - name: Remove one-off workflow and commit source changes
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-derivative-layout-fix.yml
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/wizards/security/SecurityMultiplierPage.java
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/StatementOfAssetsView.java
          git diff --cached --check
          git diff --cached
          git commit -m "Refine derivative layout and reporting columns"
          git push origin HEAD:agent/derivatives-tab
