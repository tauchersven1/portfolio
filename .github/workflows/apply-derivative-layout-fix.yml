name: Apply derivative refinements

on:
  push:
    branches:
      - agent/derivatives-tab
    paths:
      - .github/workflows/apply-derivative-layout-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/derivatives-tab
          fetch-depth: 0

      - name: Apply refinements
        run: python3 .github/scripts/apply_derivative_refinements.py

      - name: Commit source changes and remove temporary files
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-derivative-layout-fix.yml
          git rm .github/scripts/apply_derivative_refinements.py
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/wizards/security/SecurityMultiplierPage.java
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/StatementOfAssetsView.java
          git diff --cached --check
          git commit -m "Refine derivative layout and reporting columns"
          git push origin HEAD:agent/derivatives-tab
