name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Runs on PRs and fork pushes. The master branch of the main repo uses build-analyze instead.
  build:
    name: Maven Build
    if: github.ref != 'refs/heads/master' || github.repository != 'portfolio-performance/portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Maven and Sonar artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.sonar/cache
          # Include .target files: Tycho resolves OSGi dependencies from the
          # target platform definition, which is not captured by pom.xml alone
          key: ${{ runner.os }}-mvn-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-mvn-

      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Maven 3.9.16
        shell: bash
        run: |
          MAVEN_VERSION=3.9.16
          MAVEN_ARCHIVE="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          MAVEN_BASE_URL="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries"
          curl --fail --location --retry 3 --retry-delay 2 --output "/tmp/${MAVEN_ARCHIVE}" "${MAVEN_BASE_URL}/${MAVEN_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "/tmp/${MAVEN_ARCHIVE}.sha512" "${MAVEN_BASE_URL}/${MAVEN_ARCHIVE}.sha512"
          cd /tmp
          echo "$(cat ${MAVEN_ARCHIVE}.sha512)  ${MAVEN_ARCHIVE}" | sha512sum --check --status
          tar -xzf "${MAVEN_ARCHIVE}"
          echo "/tmp/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          mvn verify \
            --batch-mode \
            --file portfolio-app/pom.xml

  windows-build:
    name: Windows Build + ZIP Artifact
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Maven artifacts
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-mvn-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-mvn-

      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Maven 3.9.16
        shell: pwsh
        run: |
          $version = '3.9.16'
          $base = "https://archive.apache.org/dist/maven/maven-3/$version/binaries"
          $zip = "$env:RUNNER_TEMP/apache-maven-$version-bin.zip"
          $shaFile = "$zip.sha512"
          Invoke-WebRequest "$base/apache-maven-$version-bin.zip" -OutFile $zip
          Invoke-WebRequest "$base/apache-maven-$version-bin.zip.sha512" -OutFile $shaFile
          $expected = ((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Maven SHA-512 mismatch" }
          $target = "$env:RUNNER_TEMP/maven"
          Expand-Archive $zip -DestinationPath $target -Force
          $mavenHome = Join-Path $target "apache-maven-$version"
          Add-Content $env:GITHUB_PATH (Join-Path $mavenHome 'bin')
          "MAVEN_HOME=$mavenHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Full build and tests
        shell: pwsh
        run: |
          mvn verify --batch-mode --file portfolio-app/pom.xml 2>&1 | Tee-Object -FilePath maven-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Maven build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maven-build-log-windows-${{ github.run_number }}
          path: maven-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Bundle Windows Java runtime
        if: success()
        shell: pwsh
        run: |
          $product = 'portfolio-product/target/products/name.abuchen.portfolio.product/win32/win32/x86_64/portfolio'
          $jre = Join-Path $product 'jre'
          New-Item -ItemType Directory -Force -Path $jre | Out-Null
          Copy-Item -Path (Join-Path $env:JAVA_HOME '*') -Destination $jre -Recurse -Force
          if (-not (Test-Path (Join-Path $jre 'bin/javaw.exe'))) {
            throw 'Bundled runtime does not contain jre/bin/javaw.exe'
          }

      - name: Upload Windows x86_64 build
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: PortfolioPerformance-Windows-x86_64-${{ github.run_number }}
          path: portfolio-product/target/products/name.abuchen.portfolio.product/win32/win32/x86_64/portfolio/
          if-no-files-found: error
          retention-days: 7

  # Runs only on the master branch of the main repo; includes SonarQube analysis.
  build-analyze:
    name: Maven Build + Sonar Analysis
    if: github.ref == 'refs/heads/master' && github.repository == 'portfolio-performance/portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history required by Sonar for blame and new-code detection

      - name: Cache Maven and Sonar artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.sonar/cache
          # Include .target files: Tycho resolves OSGi dependencies from the
          # target platform definition, which is not captured by pom.xml alone
          key: ${{ runner.os }}-mvn-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-mvn-

      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Maven 3.9.16
        shell: bash
        run: |
          MAVEN_VERSION=3.9.16
          MAVEN_ARCHIVE="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          MAVEN_BASE_URL="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries"
          curl --fail --location --retry 3 --retry-delay 2 --output "/tmp/${MAVEN_ARCHIVE}" "${MAVEN_BASE_URL}/${MAVEN_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 --output "/tmp/${MAVEN_ARCHIVE}.sha512" "${MAVEN_BASE_URL}/${MAVEN_ARCHIVE}.sha512"
          cd /tmp
          echo "$(cat ${MAVEN_ARCHIVE}.sha512)  ${MAVEN_ARCHIVE}" | sha512sum --check --status
          tar -xzf "${MAVEN_ARCHIVE}"
          echo "/tmp/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build and analyze
        # sonar.login is deprecated since SonarQube 10.0 / SonarCloud — use sonar.token
        run: |
          mvn verify sonar:sonar \
            --batch-mode \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            --file portfolio-app/pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
