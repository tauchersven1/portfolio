name: Apply derivative master-data tabs

on:
  push:
    branches:
      - agent/derivatives-official-release
    paths:
      - '.github/workflows/apply-derivative-masterdata-tabs.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/derivatives-official-release
          fetch-depth: 0

      - name: Apply requested master-data changes
        run: python .github/scripts/apply_derivative_masterdata_tabs.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/wizards/security/SecurityMultiplierPage.java
          git diff --cached --quiet && exit 0
          git commit -m 'Refine derivative date defaults and master-data tabs'
          git push origin HEAD:agent/derivatives-official-release
