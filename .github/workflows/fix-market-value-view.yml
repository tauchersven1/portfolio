name: Fix market value view

on:
  push:
    branches:
      - agent/derivatives-tab
    paths:
      - .github/workflows/fix-market-value-view.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/derivatives-tab
          fetch-depth: 0

      - name: Apply market value fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/ExposureManagementView.java')
          text = path.read_text()
          old = '''            Security security = asset.getSecurity();
            SecurityPosition position = asset.getPosition();
            Money exposure = ExposureCalculator.calculate(getClient(), position, valuationDate, converter, type);
            if (exposure == null || exposure.isZero())
                return;
'''
          new = '''            Security security = asset.getSecurity();
            SecurityPosition position = asset.getPosition();
            Money exposure = type == ExposureType.MARKET_VALUE ? asset.getValuation()
                            : ExposureCalculator.calculate(getClient(), position, valuationDate, converter, type);
            if (exposure == null || exposure.isZero())
                return;
'''
          if old not in text:
              raise SystemExit('Target block not found')
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-market-value-view.yml
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/ExposureManagementView.java
          git diff --cached --check
          git commit -m "Fix market value in exposure view"
          git push origin HEAD:agent/derivatives-tab
