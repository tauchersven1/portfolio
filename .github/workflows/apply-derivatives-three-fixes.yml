name: Apply combined derivatives fixes

on:
  push:
    branches:
      - agent/derivatives-three-fixes-staging
    paths:
      - .github/workflows/apply-derivatives-three-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/derivatives-three-fixes-staging
          fetch-depth: 0

      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      - name: Apply all three fixes
        shell: pwsh
        run: python .github/scripts/apply_derivatives_three_fixes.py

      - name: Validate patch formatting
        shell: pwsh
        run: git diff --check

      - name: Full build and tests
        shell: pwsh
        run: |
          mvn verify --batch-mode --file portfolio-app/pom.xml 2>&1 | Tee-Object -FilePath maven-staging.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified combined patch
        if: success()
        shell: pwsh
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-derivatives-three-fixes.yml
          git rm .github/scripts/apply_derivatives_three_fixes.py
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/StatementOfAssetsView.java
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/columns/ExposureColumn.java
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/ExposureManagementView.java
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/views/SecuritiesChart.java
          git diff --cached --check
          git commit -m "Fix derivative chart columns and cash exposure"
          git push origin HEAD:agent/derivatives-three-fixes-staging
