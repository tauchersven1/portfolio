name: Apply derivative UI patch
permissions:
  contents: write
on:
  push:
    branches: [agent/ko-certificates-fx]
    paths: [.github/workflows/apply-derivative-ui-patch.yml]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ko-certificates-fx
      - name: Patch derivative UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/wizards/security/SecurityMultiplierPage.java')
          s=p.read_text()
          s=s.replace('private static final String FX_QUOTE_CURRENCY = "fxQuoteCurrency";','private static final String FX_QUOTE_CURRENCY = "fxQuoteCurrency";\n    private static final String FX_EXPOSURE_CURRENCY = "fxExposureCurrency";\n    private static final String ISSUER_UNDERLYING_PRICE = "issuerUnderlyingPrice";\n    private static final String ISSUER_UNDERLYING_CURRENCY = "issuerUnderlyingCurrency";')
          s=s.replace('FX_BASE_CURRENCY, FX_QUOTE_CURRENCY, CONTRACT_MONTH', 'FX_BASE_CURRENCY, FX_QUOTE_CURRENCY, FX_EXPOSURE_CURRENCY, ISSUER_UNDERLYING_PRICE,\n                    ISSUER_UNDERLYING_CURRENCY, CONTRACT_MONTH')
          s=s.replace('private Text fxQuoteCurrency;','private Text fxQuoteCurrency;\n    private Combo fxExposureCurrency;\n    private String issuerUnderlyingPrice;\n    private String issuerUnderlyingCurrency;')
          s=s.replace('GridDataFactory.fillDefaults().hint(120, SWT.DEFAULT).applyTo(strike);','GridDataFactory.fillDefaults().hint(80, SWT.DEFAULT).applyTo(strike);',1)
          s=s.replace('initialKnockoutLevelLabel = new Label(optionGroup, SWT.NONE);','new Label(optionGroup, SWT.NONE);\n        new Label(optionGroup, SWT.NONE);\n        initialKnockoutLevelLabel = new Label(optionGroup, SWT.NONE);',1)
          s=s.replace('GridDataFactory.fillDefaults().hint(120, SWT.DEFAULT).applyTo(initialKnockoutLevel);','GridDataFactory.fillDefaults().hint(80, SWT.DEFAULT).applyTo(initialKnockoutLevel);',1)
          marker='GridDataFactory.fillDefaults().hint(80, SWT.DEFAULT).applyTo(fxQuoteCurrency);'
          add=marker+'\n\n        new Label(knockoutDetailsGroup, SWT.NONE).setText("Exposure currency");\n        fxExposureCurrency = new Combo(knockoutDetailsGroup, SWT.READ_ONLY);\n        fxExposureCurrency.setItems("Base currency", "Quote currency");\n        fxExposureCurrency.select(0);\n        fxExposureCurrency.setToolTipText("Choose whether FX K.O. exposure is represented in base or quote currency before conversion to the reporting currency.");\n        new Label(knockoutDetailsGroup, SWT.NONE);\n        new Label(knockoutDetailsGroup, SWT.NONE);'
          s=s.replace(marker,add,1)
          s=s.replace('fxQuoteCurrency.setText(valueOrEmpty(property(FX_QUOTE_CURRENCY)));','fxQuoteCurrency.setText(valueOrEmpty(property(FX_QUOTE_CURRENCY)));\n        fxExposureCurrency.select("QUOTE".equalsIgnoreCase(property(FX_EXPOSURE_CURRENCY)) ? 1 : 0);\n        issuerUnderlyingPrice = property(ISSUER_UNDERLYING_PRICE);\n        issuerUnderlyingCurrency = property(ISSUER_UNDERLYING_CURRENCY);')
          s=s.replace('if (fxQuoteCurrency != null)\n            fxQuoteCurrency.setEnabled(enabled);','if (fxQuoteCurrency != null)\n            fxQuoteCurrency.setEnabled(enabled);\n        if (fxExposureCurrency != null)\n            fxExposureCurrency.setEnabled(enabled);')
          s=s.replace('applyTextIfEmpty(fxQuoteCurrency, result.get(FX_QUOTE_CURRENCY));','applyTextIfEmpty(fxQuoteCurrency, result.get(FX_QUOTE_CURRENCY));\n        if (issuerUnderlyingPrice == null) issuerUnderlyingPrice = result.get(ISSUER_UNDERLYING_PRICE);\n        if (issuerUnderlyingCurrency == null) issuerUnderlyingCurrency = result.get(ISSUER_UNDERLYING_CURRENCY);')
          s=s.replace('updateDerivativeControls();\n        }\n        catch (IOException e)', 'updateDerivativeControls();\n            if (showMessages && result.get().get(UNDERLYING) != null\n                            && underlyingSecurities.get(comboText(underlying)) == null\n                            && !fxUnderlying.getSelection())\n                MessageDialog.openInformation(getShell(), "Underlying nicht vorhanden",\n                                "Underlying nicht vorhanden, bitte anlegen und dann verknüpfen. Bis dahin wird – sofern vom Emittenten geliefert – dessen Underlying-Kurs als Exposure-Fallback verwendet.");\n        }\n        catch (IOException e)',1)
          s=s.replace('setProperty(FX_QUOTE_CURRENCY, isFxUnderlying ? upper(text(fxQuoteCurrency)) : null);','setProperty(FX_QUOTE_CURRENCY, isFxUnderlying ? upper(text(fxQuoteCurrency)) : null);\n            setProperty(FX_EXPOSURE_CURRENCY, isFxUnderlying && fxExposureCurrency.getSelectionIndex() == 1 ? "QUOTE" : isFxUnderlying ? "BASE" : null);\n            setProperty(ISSUER_UNDERLYING_PRICE, isKnockout ? issuerUnderlyingPrice : null);\n            setProperty(ISSUER_UNDERLYING_CURRENCY, isKnockout ? issuerUnderlyingCurrency : null);')
          s=s.replace('setProperty(FX_QUOTE_CURRENCY, null);\n            SecurityKnockoutLevel', 'setProperty(FX_QUOTE_CURRENCY, null);\n            setProperty(FX_EXPOSURE_CURRENCY, null);\n            setProperty(ISSUER_UNDERLYING_PRICE, null);\n            setProperty(ISSUER_UNDERLYING_CURRENCY, null);\n            SecurityKnockoutLevel')
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add name.abuchen.portfolio.ui/src/name/abuchen/portfolio/ui/wizards/security/SecurityMultiplierPage.java
          git diff --cached --quiet && exit 0
          git commit -m "Improve KO underlying and FX exposure UI"
          git push
