name: Apply explain compile fix

on:
  push:
    branches:
      - agent/transaction-multiplier-fix
    paths:
      - .github/workflows/apply-explain-compile-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore explain implementation and remove helper workflow
        shell: bash
        run: |
          git fetch origin master
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = 'name.abuchen.portfolio/src/name/abuchen/portfolio/snapshot/security/LazySecurityPerformanceRecord.java'
          source = Path(path)
          current = source.read_text(encoding='utf-8')
          master = subprocess.check_output(['git', 'show', f'origin/master:{path}'], text=True)

          marker = '    @Override\n    public Optional<Trail> explain(String key)\n'
          current_start = current.index(marker)
          master_start = master.index(marker)

          current_end = current.index('\n    }\n}', current_start) + len('\n    }')
          master_end = master.index('\n    }\n\n}', master_start) + len('\n    }')

          repaired = current[:current_start] + master[master_start:master_end] + current[current_end:]
          source.write_text(repaired, encoding='utf-8')
          Path('.github/workflows/apply-explain-compile-fix.yml').unlink()
          PY

      - name: Commit compile fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add name.abuchen.portfolio/src/name/abuchen/portfolio/snapshot/security/LazySecurityPerformanceRecord.java .github/workflows/apply-explain-compile-fix.yml
          git commit -m "Fix performance record trail explanation"
          git push origin HEAD:agent/transaction-multiplier-fix
