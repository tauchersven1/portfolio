name: Apply explain compile fix

on:
  push:
    branches:
      - agent/transaction-multiplier-fix
    paths:
      - .github/workflows/apply-explain-compile-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore explain implementation and remove helper workflow
        shell: python
        run: |
          from pathlib import Path

          source = Path('name.abuchen.portfolio/src/name/abuchen/portfolio/snapshot/security/LazySecurityPerformanceRecord.java')
          text = source.read_text(encoding='utf-8')

          old = '''    @Override
    public Optional<Trail> explain(String key)
    {
        switch (key)
        {
            case Trails.FIFO_COST:
                return Optional.of(costCalculation.get().fifoCostTrail());
            default:
                return super.explain(key);
        }
    }
'''

          new = '''    @Override
    public Optional<Trail> explain(String key)
    {
        switch (key)
        {
            case Trails.FIFO_COST:
                return Trail.of(getSecurityName(), costCalculation.get().fifoCostTrail());
            case Trails.REALIZED_CAPITAL_GAINS:
                return Trail.of(getSecurityName(), getRealizedCapitalGains(CostMethod.FIFO).getCapitalGainsTrail());
            case Trails.REALIZED_CAPITAL_GAINS_FOREX:
                return Trail.of(getSecurityName(),
                                getRealizedCapitalGains(CostMethod.FIFO).getForexCapitalGainsTrail());
            case Trails.UNREALIZED_CAPITAL_GAINS:
                return Trail.of(getSecurityName(), getUnrealizedCapitalGains(CostMethod.FIFO).getCapitalGainsTrail());
            case Trails.UNREALIZED_CAPITAL_GAINS_FOREX:
                return Trail.of(getSecurityName(),
                                getUnrealizedCapitalGains(CostMethod.FIFO).getForexCapitalGainsTrail());
            default:
                return Optional.empty();
        }
    }
'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one broken explain implementation, found {text.count(old)}')

          source.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-explain-compile-fix.yml').unlink()

      - name: Commit compile fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add name.abuchen.portfolio/src/name/abuchen/portfolio/snapshot/security/LazySecurityPerformanceRecord.java .github/workflows/apply-explain-compile-fix.yml
          git commit -m "Fix performance record trail explanation"
          git push origin HEAD:agent/transaction-multiplier-fix
