name: Derivatives Bridge Windows Test Build

on:
  push:
    branches:
      - agent/derivatives-addon-standalone
      - agent/derivatives-addon-security-tab
    paths:
      - 'name.abuchen.portfolio.ui/**'
      - 'portfolio-app/**'
      - 'portfolio-product/**'
      - '.github/workflows/derivatives-bridge-windows.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x86_64 PP Bridge
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Maven artifacts
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-bridge-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-bridge-
            ${{ runner.os }}-mvn-

      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      - name: Build Portfolio Performance bridge
        shell: pwsh
        run: |
          mvn verify --batch-mode --file portfolio-app/pom.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle Windows Java runtime
        shell: pwsh
        run: |
          $product = 'portfolio-product/target/products/name.abuchen.portfolio.product/win32/win32/x86_64/portfolio'
          if (-not (Test-Path $product)) { throw "Windows product folder not found: $product" }
          $jre = Join-Path $product 'jre'
          New-Item -ItemType Directory -Force -Path $jre | Out-Null
          Copy-Item -Path (Join-Path $env:JAVA_HOME '*') -Destination $jre -Recurse -Force
          if (-not (Test-Path (Join-Path $jre 'bin/javaw.exe'))) {
            throw 'Bundled runtime does not contain jre/bin/javaw.exe'
          }

      - name: Upload Windows PP bridge test build
        uses: actions/upload-artifact@v6
        with:
          name: PortfolioPerformance-Bridge-Windows-x86_64
          path: portfolio-product/target/products/name.abuchen.portfolio.product/win32/win32/x86_64/portfolio/
          if-no-files-found: error
          retention-days: 14
