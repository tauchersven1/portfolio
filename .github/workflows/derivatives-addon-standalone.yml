name: Derivatives Add-on Standalone

on:
  push:
    branches:
      - agent/derivatives-addon-standalone
      - agent/derivatives-addon-security-tab
    paths:
      - 'derivatives-addon-standalone/**'
      - 'name.abuchen.portfolio/**'
      - 'name.abuchen.portfolio.tests/**'
      - 'name.abuchen.portfolio.ui/**'
      - 'name.abuchen.portfolio.ui.tests/**'
      - '.github/workflows/derivatives-addon-standalone.yml'
  pull_request:
    paths:
      - 'derivatives-addon-standalone/**'
      - 'name.abuchen.portfolio/**'
      - 'name.abuchen.portfolio.tests/**'
      - 'name.abuchen.portfolio.ui/**'
      - 'name.abuchen.portfolio.ui.tests/**'
      - '.github/workflows/derivatives-addon-standalone.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16
      - name: Build Portfolio Performance bridge repository
        run: mvn --batch-mode --file portfolio-app/pom.xml verify

      - name: Point add-on target at local bridge repository
        shell: bash
        run: |
          test -d "$GITHUB_WORKSPACE/portfolio-product/target/repository"
          python - <<'PY'
          from pathlib import Path
          import os
          target = Path("derivatives-addon-standalone/derivatives-target-definition/derivatives-target-definition.target")
          text = target.read_text(encoding="utf-8")
          text = text.replace(
              "https://updates.portfolio-performance.info/portfolio/",
              Path(os.environ["GITHUB_WORKSPACE"], "portfolio-product", "target", "repository").as_uri()
          )
          target.write_text(text, encoding="utf-8")
          PY

      - name: Build standalone plugin and p2 repository
        run: mvn --batch-mode --file derivatives-addon-standalone/pom.xml clean verify
      - name: Package p2 update site
        run: |
          cd derivatives-addon-standalone/de.venari.portfolio.derivatives.updatesite/target/repository
          zip -r "$GITHUB_WORKSPACE/PortfolioPerformance-Derivatives-Addon-UpdateSite.zip" .
      - uses: actions/upload-artifact@v6
        with:
          name: PortfolioPerformance-Derivatives-Addon-UpdateSite
          path: PortfolioPerformance-Derivatives-Addon-UpdateSite.zip
          retention-days: 14
