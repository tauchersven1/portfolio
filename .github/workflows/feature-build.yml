name: Feature Build

on:
  push:
    branches:
      - agent/security-multiplier

jobs:
  build:
    name: Full Maven Build and Windows Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Maven artifacts
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-mvn-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-mvn-

      - name: Set up Zulu JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      - name: Full build and tests
        run: |
          mvn verify \
            --batch-mode \
            --file portfolio-app/pom.xml

      - name: Show packaged products
        if: success()
        run: find portfolio-product/target/products -maxdepth 3 -print | sort

      - name: Upload Windows x86_64 build
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: PortfolioPerformance-Windows-x86_64-security-multiplier
          path: |
            portfolio-product/target/products/*win32.win32.x86_64*
            portfolio-product/target/products/**/*win32.win32.x86_64*
          if-no-files-found: error
          retention-days: 7
